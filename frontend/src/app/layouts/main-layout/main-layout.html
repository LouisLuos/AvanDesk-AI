<div
 class="flex min-h-screen flex-col bg-[radial-gradient(ellipse_at_top,_rgba(99,102,241,0.12),_transparent_55%)] selection: selection:"
>
 <header class="sticky top-0 z-40 border-b">
 <div class="mx-auto flex h-16 max-w-7xl items-center justify-between gap-6 px-4 sm:px-6 lg:px-8">
 <div class="flex items-center gap-8">
 <a routerLink="/" class="flex items-center gap-3" id="nav-logo">
 <span
 class="flex h-9 w-9 items-center justify-center text-sm font-bold"
>
 AD
 </span>
 <span class="text-lg font-bold tracking-tight">
 AvanDesk<span >-AI</span>
 </span>
 </a>

 <nav class="hidden items-center gap-1 md:flex" aria-label="Navegação principal">
 @for (item of menu; track item.rota) {
 <a
 [id]="item.id"
 [routerLink]="item.rota"
 routerLinkActive="bg-black text-white"
 class="px-3 py-2 text-sm font-medium transition"
>
 {{ item.rotulo }}
 </a>
 }
 </nav>
 </div>

 <div class="flex items-center gap-1 sm:gap-2">
 <button type="button" class="btn btn-ghost" aria-label="Buscar" id="btn-buscar" title="Buscar (em breve)">
 <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
 <circle cx="11" cy="11" r="7" />
 <path d="m20 20-3.5-3.5" />
 </svg>
 </button>
 <button type="button" class="btn btn-ghost" aria-label="Notificações" id="btn-notificacoes" title="Notificações (em breve)">
 <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
 <path d="M6 8a6 6 0 1 1 12 0c0 7 3 9 3 9H3s3-2 3-9" />
 <path d="M10.3 21a1.94 1.94 0 0 0 3.4 0" />
 </svg>
 </button>
 <div class="ml-2 flex items-center gap-3 border-l pl-4">
 <span
 class="flex h-8 w-8 items-center justify-center text-xs font-semibold"
 aria-hidden="true"
>
 {{ iniciais }}
 </span>
 <div class="hidden leading-tight sm:block">
 <p class="text-sm font-medium">{{ usuario.nome }}</p>
 <p class="text-xs">{{ usuario.perfil }}</p>
 </div>
 </div>
 </div>
 </div>

 <!-- Navegação mobile -->
 <nav class="flex gap-1 overflow-x-auto border-t px-4 py-2 md:hidden" aria-label="Navegação principal (mobile)">
 @for (item of menu; track item.rota) {
 <a
 [routerLink]="item.rota"
 routerLinkActive="bg-black text-white"
 class="px-3 py-1.5 text-sm font-medium whitespace-nowrap transition"
>
 {{ item.rotulo }}
 </a>
 }
 </nav>
 </header>

 <main class="mx-auto w-full max-w-7xl flex-1 px-4 py-8 sm:px-6 lg:px-8">
 <router-outlet />
 </main>

 <footer class="border-t py-5 text-center text-xs">
 AvanDesk-AI &bull; Rede Lúmen Diagnósticos &bull; 2026
 </footer>
</div>

<app-toast-container />
