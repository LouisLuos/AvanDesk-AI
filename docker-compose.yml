services:
  postgres:
    image: postgres:16-alpine
    container_name: avandesk-db
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: avandesk_db
      POSTGRES_USER: avandesk
      POSTGRES_PASSWORD: avandesk_dev
    volumes:
      - avandesk_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U avandesk -d avandesk_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: avandesk-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/avandesk_db
      SPRING_DATASOURCE_USERNAME: avandesk
      SPRING_DATASOURCE_PASSWORD: avandesk_dev
      PORT: 8080
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: avandesk-frontend
    restart: unless-stopped
    ports:
      - "4200:80"
    depends_on:
      - backend

volumes:
  avandesk_pgdata:
    driver: local
