openapi: 3.1.0
info:
  title: OpenAPI definition
  version: v0
servers:
- url: http://localhost:8080
  description: Generated server url
paths:
  /api/v1/unidades/{id}:
    get:
      tags:
      - unidade-controller
      operationId: buscarPorId
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseUnidadeResponse"
    put:
      tags:
      - unidade-controller
      operationId: editar
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UnidadeRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseUnidadeResponse"
  /api/v1/unidades:
    get:
      tags:
      - unidade-controller
      operationId: listar
      parameters:
      - name: ativo
        in: query
        required: false
        schema:
          type: boolean
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseListUnidadeResponse"
    post:
      tags:
      - unidade-controller
      operationId: cadastrar
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UnidadeRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseUnidadeResponse"
  /api/v1/chamados:
    post:
      tags:
      - chamado-controller
      operationId: registrar
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChamadoRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseChamadoResponse"
  /api/v1/unidades/{id}/desativar:
    patch:
      tags:
      - unidade-controller
      operationId: desativar
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseUnidadeResponse"
  /health:
    get:
      tags:
      - health-controller
      operationId: health
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: object
                additionalProperties: {}
  /api/v1/sistemas-equipamentos:
    get:
      tags:
      - sistema-equipamento-controller
      operationId: listarAtivos
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseListSistemaEquipamentoResponse"
  /api/v1/categorias:
    get:
      tags:
      - categoria-controller
      operationId: listarAtivas
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseListCategoriaResponse"
components:
  schemas:
    UnidadeRequest:
      type: object
      properties:
        nome:
          type: string
          maxLength: 120
          minLength: 0
        identificacao:
          type: string
          maxLength: 20
          minLength: 0
          pattern: "^[A-Za-z0-9-]*$"
        localizacao:
          type: string
          maxLength: 255
          minLength: 0
        atendimento_24h:
          type: boolean
      required:
      - identificacao
      - nome
    ApiResponseUnidadeResponse:
      type: object
      properties:
        statusCode:
          type: integer
          format: int32
        message:
          type: string
        data:
          $ref: "#/components/schemas/UnidadeResponse"
        errors:
          type: array
          items:
            type: string
    UnidadeResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        nome:
          type: string
        identificacao:
          type: string
        localizacao:
          type: string
        atendimento_24h:
          type: boolean
        ativo:
          type: boolean
    ChamadoRequest:
      type: object
      properties:
        unidadeId:
          type: string
          format: uuid
        canalOrigem:
          type: string
          enum:
          - LIGACAO
          - PRESENCIAL
          - WHATSAPP
          - EMAIL
        solicitante:
          $ref: "#/components/schemas/SolicitanteRequest"
        descricao:
          type: string
          maxLength: 2000
          minLength: 10
        categoriaId:
          type: string
          format: uuid
        sistemaEquipamentoId:
          type: string
          format: uuid
        registroIniciadoEm:
          type: string
          format: date-time
      required:
      - canalOrigem
      - categoriaId
      - descricao
      - solicitante
      - unidadeId
    SolicitanteRequest:
      type: object
      properties:
        nome:
          type: string
          maxLength: 120
          minLength: 0
        contato:
          type: string
          maxLength: 254
          minLength: 0
      required:
      - contato
    ApiResponseChamadoResponse:
      type: object
      properties:
        statusCode:
          type: integer
          format: int32
        message:
          type: string
        data:
          $ref: "#/components/schemas/ChamadoResponse"
        errors:
          type: array
          items:
            type: string
    ChamadoResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        codigo:
          type: string
        status:
          type: string
          enum:
          - ABERTO
          - EM_TRIAGEM
          - EM_ATENDIMENTO
          - AGUARDANDO
          - RESOLVIDO
          - REABERTO
          - FECHADO
          - CANCELADO
          - MESCLADO
        dataCriacao:
          type: string
          format: date-time
        origemDado:
          type: string
          enum:
          - REAL
          - TESTE
          - SIMULADO
    ApiResponseListUnidadeResponse:
      type: object
      properties:
        statusCode:
          type: integer
          format: int32
        message:
          type: string
        data:
          type: array
          items:
            $ref: "#/components/schemas/UnidadeResponse"
        errors:
          type: array
          items:
            type: string
    ApiResponseListSistemaEquipamentoResponse:
      type: object
      properties:
        statusCode:
          type: integer
          format: int32
        message:
          type: string
        data:
          type: array
          items:
            $ref: "#/components/schemas/SistemaEquipamentoResponse"
        errors:
          type: array
          items:
            type: string
    SistemaEquipamentoResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        nome:
          type: string
    ApiResponseListCategoriaResponse:
      type: object
      properties:
        statusCode:
          type: integer
          format: int32
        message:
          type: string
        data:
          type: array
          items:
            $ref: "#/components/schemas/CategoriaResponse"
        errors:
          type: array
          items:
            type: string
    CategoriaResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        nome:
          type: string
