openapi: 3.0.0
info:
  title: Nexo MVP API (Rede Lúmen Diagnósticos)
  version: 1.0.0
  description: API RESTful do MVP da plataforma Nexo para gerenciamento de chamados de TI e atendimento ambulatorial da Rede Lúmen Diagnósticos.
servers:
  - url: /api/v1
    description: Servidor Local (API v1)
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    ApiResponse:
      type: object
      properties:
        status_code:
          type: integer
          example: 200
        message:
          type: string
          example: "Operação realizada com sucesso"
        data:
          type: object
          nullable: true
          description: "O payload principal da resposta (varia conforme o endpoint)"
        errors:
          type: array
          nullable: true
          items:
            type: string
          example: null
    ApiResponseError:
      type: object
      properties:
        status_code:
          type: integer
          example: 400
        message:
          type: string
          example: "Erro de validação"
        data:
          type: object
          nullable: true
          example: null
        errors:
          type: array
          nullable: true
          items:
            type: string
          example:
            - "Campo 'unidade_id' é obrigatório."
    UnidadeRequest:
      type: object
      required: [nome, identificacao]
      properties:
        nome:
          type: string
          maxLength: 120
          example: "U.03 Boa Viagem"
        identificacao:
          type: string
          maxLength: 20
          pattern: "^[A-Za-z0-9-]*$"
          example: "LUM-BVG"
        localizacao:
          type: string
          maxLength: 255
          nullable: true
          example: "Rua Boa Viagem, 123"
        atendimento_24h:
          type: boolean
          example: false
    UnidadeResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: "a1f0c3e2-0001-4000-8000-000000000001"
        nome:
          type: string
          example: "U.03 Boa Viagem"
        identificacao:
          type: string
          example: "LUM-BVG"
        localizacao:
          type: string
          nullable: true
          example: "Rua Boa Viagem, 123"
        atendimento_24h:
          type: boolean
          example: false
        ativo:
          type: boolean
          example: true
    ChamadoResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: 123e4567-e89b-12d3-a456-426614174000
        codigo:
          type: string
          example: LUM-2026-000123
        status:
          type: string
          enum: [ABERTO, EM_TRIAGEM, EM_ATENDIMENTO, AGUARDANDO, RESOLVIDO, REABERTO, FECHADO, CANCELADO, MESCLADO]
          example: ABERTO
        data_criacao:
          type: string
          format: date-time
          example: "2026-10-07T14:30:00Z"
        origem_dado:
          type: string
          enum: [REAL, TESTE, SIMULADO]
          description: "Definido pelo servidor conforme o ambiente (REAL em produção); o cliente nunca envia."
          example: TESTE
    ChamadoDetalheResponse:
      type: object
      description: "Detalhe completo do chamado (HU02 + HU05): status, responsável, contatos e linha do tempo cronológica em UTC."
      properties:
        id:
          type: string
          format: uuid
        codigo:
          type: string
          example: LUM-2026-000123
        status:
          type: string
          enum: [ABERTO, EM_TRIAGEM, EM_ATENDIMENTO, AGUARDANDO, RESOLVIDO, REABERTO, FECHADO, CANCELADO, MESCLADO]
        motivo_espera:
          type: string
          nullable: true
          enum: [FORNECEDOR, SOLICITANTE, PECA_EQUIPAMENTO]
        descricao:
          type: string
        canal_origem:
          type: string
          enum: [LIGACAO, PRESENCIAL, WHATSAPP, EMAIL]
        unidade:
          type: object
          properties:
            id:
              type: string
              format: uuid
            nome:
              type: string
        categoria:
          $ref: '#/components/schemas/ItemListaResponse'
        sistema_equipamento:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/ItemListaResponse'
        solicitante:
          type: object
          properties:
            nome:
              type: string
              nullable: true
            contato:
              type: string
        responsavel:
          type: object
          nullable: true
          properties:
            id:
              type: string
              format: uuid
            nome:
              type: string
        prioridade:
          type: string
          nullable: true
          enum: [ALTA, MEDIA, BAIXA]
        aberto_em:
          type: string
          format: date-time
        primeira_resposta_em:
          type: string
          format: date-time
          nullable: true
        resolvido_em:
          type: string
          format: date-time
          nullable: true
          description: "Data da resolução atual (HU06). Volta a null quando o chamado é reaberto."
        resolucao:
          type: string
          nullable: true
          description: "Última resolução registrada (HU06). Continua preenchida se o chamado for reaberto."
        causa_raiz:
          type: string
          nullable: true
        possivel_recorrencia:
          type: boolean
          example: false
        origem_dado:
          type: string
          enum: [REAL, TESTE, SIMULADO]
        registros_contato:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
              canal:
                type: string
                enum: [LIGACAO, PRESENCIAL, WHATSAPP, EMAIL]
              direcao:
                type: string
                enum: [RECEBIDO, ENVIADO]
              conteudo:
                type: string
              ocorrido_em:
                type: string
                format: date-time
              solicitante:
                type: object
                properties:
                  nome:
                    type: string
                    nullable: true
                  contato:
                    type: string
              registrado_por:
                type: string
                nullable: true
        historico:
          type: array
          items:
            type: object
            properties:
              id_evento:
                type: string
                format: uuid
              tipo:
                type: string
              data:
                type: string
                format: date-time
              autor:
                type: string
                nullable: true
              detalhes:
                type: object
                additionalProperties: true
    ChamadoResumoResponse:
      type: object
      description: "Uma linha da fila de chamados (HU14). Ainda sem SLA: o cálculo do prazo é de outra HU."
      properties:
        id:
          type: string
          format: uuid
        codigo:
          type: string
          example: LUM-2026-000162
        titulo:
          type: string
          description: "Primeira linha da descrição, com até 80 caracteres (cortada com '…')."
          example: Impressora de etiquetas da coleta parada
        unidade:
          type: object
          properties:
            id:
              type: string
              format: uuid
            nome:
              type: string
              example: U.03 Boa Viagem
        categoria:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/ItemListaResponse'
        canal_origem:
          type: string
          enum: [LIGACAO, PRESENCIAL, WHATSAPP, EMAIL]
        status:
          type: string
          enum: [ABERTO, EM_TRIAGEM, EM_ATENDIMENTO, AGUARDANDO, RESOLVIDO, REABERTO, FECHADO, CANCELADO, MESCLADO]
        prioridade:
          type: string
          nullable: true
          enum: [ALTA, MEDIA, BAIXA]
          description: "Prioridade final definida pelo analista; nula enquanto não houver triagem."
        responsavel:
          type: object
          nullable: true
          description: "Nulo quando o chamado não tem responsável (\"Não atribuído\")."
          properties:
            id:
              type: string
              format: uuid
            nome:
              type: string
              example: Analista Dev Um
        aberto_em:
          type: string
          format: date-time
          example: "2026-10-29T12:00:00Z"
        atualizado_em:
          type: string
          format: date-time
          description: "Último evento do histórico; sem eventos, a data de abertura."
          example: "2026-10-29T12:30:00Z"
    FilaChamadosResponse:
      type: object
      description: "Página da fila de chamados (HU14), do mais recente para o mais antigo."
      properties:
        itens:
          type: array
          items:
            $ref: '#/components/schemas/ChamadoResumoResponse'
        pagina:
          type: integer
          description: "Número da página, começando em 0."
          example: 0
        tamanho:
          type: integer
          example: 20
        total_itens:
          type: integer
          format: int64
          example: 31
        total_paginas:
          type: integer
          example: 2
        totais_por_status:
          type: object
          description: "Quantos chamados de cada status atendem aos filtros, ignorando o filtro de status (cartões do topo). Sempre traz os 9 status, mesmo com zero."
          additionalProperties:
            type: integer
            format: int64
          example:
            ABERTO: 12
            EM_TRIAGEM: 5
            EM_ATENDIMENTO: 9
            AGUARDANDO: 4
            RESOLVIDO: 1
            REABERTO: 0
            FECHADO: 0
            CANCELADO: 0
            MESCLADO: 0
    ItemListaResponse:
      type: object
      description: "Item das listas do formulário de registro (categorias e sistemas/equipamentos)."
      properties:
        id:
          type: string
          format: uuid
        nome:
          type: string
          example: Equipamento de apoio
    UsuarioResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        nome:
          type: string
          example: "Analista Dev Um"
        email:
          type: string
          example: "analista1@lumen.local"
        perfil:
          type: string
          enum: [ANALISTA_SUPORTE, LIDERANCA_TI]
          example: ANALISTA_SUPORTE
    AnalistaRequest:
      type: object
      required: [nome, email]
      properties:
        nome:
          type: string
          maxLength: 120
          example: Ana Souza
        email:
          type: string
          format: email
          maxLength: 254
          description: Domínio corporativo; é gravado em minúsculas e não pode repetir.
          example: ana.souza@lumen.local
    AnalistaResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        nome:
          type: string
          example: Ana Souza
        email:
          type: string
          example: ana.souza@lumen.local
        ativo:
          type: boolean
          example: true
        criado_em:
          type: string
          format: date-time
    AnalistaCadastradoResponse:
      type: object
      properties:
        analista:
          $ref: '#/components/schemas/AnalistaResponse'
        senha_temporaria:
          type: string
          description: Só aparece nesta resposta. 12 caracteres sem ambíguos (0/O, 1/l/I).
          example: Kp7m-Qx4t-Rz9w
    TotalPorResponsavelResponse:
      type: object
      properties:
        responsavel_id:
          type: string
          format: uuid
        total:
          type: integer
          example: 6
    ResponsavelRequest:
      type: object
      required: [responsavel_id]
      properties:
        responsavel_id:
          type: string
          format: uuid
          description: "Id de um analista de suporte ativo. Para assumir, o próprio id (o login devolve em usuario.id)."
          example: "00000000-0000-0000-0000-0000000000a2"
    StatusRequest:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ABERTO, EM_TRIAGEM, EM_ATENDIMENTO, AGUARDANDO, RESOLVIDO, REABERTO, FECHADO, CANCELADO, MESCLADO]
          example: AGUARDANDO
        motivo_espera:
          type: string
          enum: [FORNECEDOR, SOLICITANTE, PECA_EQUIPAMENTO]
          description: "Obrigatório para AGUARDANDO."
        motivo_cancelamento:
          type: string
          maxLength: 500
          description: "Obrigatório para CANCELADO."
        motivo_reabertura:
          type: string
          maxLength: 500
          description: "Obrigatório para REABERTO (HU06). Só até 7 dias depois da resolução."
    ResolucaoRequest:
      type: object
      required: [resolucao]
      properties:
        resolucao:
          type: string
          minLength: 10
          maxLength: 2000
          example: "Cabo de rede da impressora estava solto no rack; recolocado e impressão testada."
        causa_raiz:
          type: string
          maxLength: 1000
          description: "Opcional. Em branco vira null."
        possivel_recorrencia:
          type: boolean
          default: false
          description: "Marca causa que pode se repetir (RN09)."
    RegistroContatoRequest:
      type: object
      required: [canal, conteudo]
      properties:
        canal:
          type: string
          enum: [LIGACAO, PRESENCIAL, WHATSAPP, EMAIL]
        direcao:
          type: string
          enum: [RECEBIDO, ENVIADO]
          default: RECEBIDO
        conteudo:
          type: string
          maxLength: 2000
          example: "Solicitante ligou cobrando retorno."
        ocorrido_em:
          type: string
          format: date-time
          description: "Padrão: agora. Não pode estar no futuro (1 min de tolerância) nem antes do minuto da abertura do chamado."
        solicitante:
          type: object
          description: "Quem relatou. Padrão: o solicitante do chamado, que não muda."
          required: [contato]
          properties:
            nome:
              type: string
              maxLength: 120
            contato:
              type: string
              maxLength: 254
              example: "+5581987650000"
        identificador_externo:
          type: string
          maxLength: 255
          description: "ID da mensagem do WhatsApp ou Message-ID do e-mail. Único por canal (RN16)."
security:
  - bearerAuth: []
paths:
  /auth/login:
    post:
      summary: Autenticar no sistema (HU09)
      tags:
        - Autenticação
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, senha]
              properties:
                email:
                  type: string
                  format: email
                  example: analista1@lumen.local
                senha:
                  type: string
                  example: nexo-dev-2026
      responses:
        '200':
          description: Login realizado com sucesso
          content:
            application/json:
              schema:
                type: object
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                properties:
                  data:
                    type: object
                    properties:
                      access_token:
                        type: string
                      usuario:
                        $ref: '#/components/schemas/UsuarioResponse'
        '400':
          description: Erro de validação dos campos de entrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseError'
        '401':
          description: Credenciais inválidas ou usuário inativo (mensagem genérica anti-enumeração)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseError'
              example:
                status_code: 401
                message: "E-mail ou senha inválidos."
                data: null
                errors: null
  /auth/logout:
    post:
      summary: Encerrar sessão do usuário (HU09)
      tags:
        - Autenticação
      responses:
        '200':
          description: Logout realizado com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
              example:
                status_code: 200
                message: "Logout realizado com sucesso"
                data: null
                errors: null
  /unidades:
    get:
      summary: Listar unidades diagnósticas (HU11)
      tags:
        - Unidades
      parameters:
        - in: query
          name: ativo
          required: false
          description: Filtra unidades pela situação ativa/inativa.
          schema:
            type: boolean
      responses:
        '200':
          description: Lista de unidades ordenada alfabeticamente por nome
          content:
            application/json:
              schema:
                type: object
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/UnidadeResponse'
    post:
      summary: Cadastrar nova unidade diagnóstica (HU11)
      tags:
        - Unidades
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UnidadeRequest'
      responses:
        '201':
          description: Unidade cadastrada com sucesso
          content:
            application/json:
              schema:
                type: object
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                properties:
                  data:
                    $ref: '#/components/schemas/UnidadeResponse'
        '400':
          description: Erro de validação ou identificação duplicada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseError'
  /unidades/{id}:
    get:
      summary: Buscar unidade por ID (HU11)
      tags:
        - Unidades
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Unidade encontrada
          content:
            application/json:
              schema:
                type: object
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                properties:
                  data:
                    $ref: '#/components/schemas/UnidadeResponse'
        '404':
          description: Unidade não encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseError'
    put:
      summary: Editar unidade existente (HU11)
      tags:
        - Unidades
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UnidadeRequest'
      responses:
        '200':
          description: Unidade atualizada com sucesso
          content:
            application/json:
              schema:
                type: object
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                properties:
                  data:
                    $ref: '#/components/schemas/UnidadeResponse'
        '400':
          description: Erro de validação ou identificação duplicada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseError'
        '404':
          description: Unidade não encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseError'
  /unidades/{id}/desativar:
    patch:
      summary: Desativar unidade logicamente (HU11)
      tags:
        - Unidades
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Unidade desativada com sucesso
          content:
            application/json:
              schema:
                type: object
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                properties:
                  data:
                    $ref: '#/components/schemas/UnidadeResponse'
        '404':
          description: Unidade não encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseError'
  /categorias:
    get:
      summary: Listar as Categorias Ativas (HU01)
      description: "Opções do campo categoria no registro de chamado, ordenadas por nome."
      tags:
        - Catálogo
      responses:
        '200':
          description: Categorias ativas
          content:
            application/json:
              schema:
                type: object
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ItemListaResponse'
  /sistemas-equipamentos:
    get:
      summary: Listar os Sistemas e Equipamentos Ativos (HU01)
      description: "Opções do campo sistema/equipamento no registro de chamado, ordenadas por nome."
      tags:
        - Catálogo
      responses:
        '200':
          description: Sistemas e equipamentos ativos
          content:
            application/json:
              schema:
                type: object
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ItemListaResponse'
  /chamados:
    get:
      summary: Listar e buscar chamados na fila (HU14)
      description: |
        Fila paginada, do mais recente para o mais antigo (aberto_em DESC, id para desempatar). A ordem é fixa.
        Todos os filtros são opcionais e se somam: cada filtro informado restringe mais o resultado.
        Valor inválido em um filtro (ex.: status=XPTO) responde 400.
      tags:
        - Chamados
      parameters:
        - in: query
          name: page
          required: false
          description: Número da página, começando em 0.
          schema:
            type: integer
            minimum: 0
            default: 0
        - in: query
          name: size
          required: false
          description: Itens por página (1 a 100).
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - in: query
          name: status
          required: false
          description: Um ou mais status. Para vários, repita o parâmetro (status=ABERTO&status=EM_TRIAGEM).
          style: form
          explode: true
          schema:
            type: array
            items:
              type: string
              enum: [ABERTO, EM_TRIAGEM, EM_ATENDIMENTO, AGUARDANDO, RESOLVIDO, REABERTO, FECHADO, CANCELADO, MESCLADO]
        - in: query
          name: unidade_id
          required: false
          schema:
            type: string
            format: uuid
        - in: query
          name: prioridade
          required: false
          description: Prioridade final.
          schema:
            type: string
            enum: [ALTA, MEDIA, BAIXA]
        - in: query
          name: canal_origem
          required: false
          schema:
            type: string
            enum: [LIGACAO, PRESENCIAL, WHATSAPP, EMAIL]
        - in: query
          name: responsavel_id
          required: false
          schema:
            type: string
            format: uuid
        - in: query
          name: sem_responsavel
          required: false
          description: Só chamados sem responsável (responsavel_id IS NULL).
          schema:
            type: boolean
            default: false
        - in: query
          name: sem_prioridade
          required: false
          description: Só chamados ainda sem prioridade final (aguardando triagem).
          schema:
            type: boolean
            default: false
        - in: query
          name: meus
          required: false
          description: Só chamados do usuário autenticado, identificado pelo token (o cliente não envia o id). Junto com um responsavel_id de outra pessoa, o resultado é vazio.
          schema:
            type: boolean
            default: false
        - in: query
          name: codigo
          required: false
          description: Código exato do chamado (LUM-AAAA-NNNNNN), sem diferenciar maiúsculas.
          schema:
            type: string
            example: LUM-2026-000162
      responses:
        '200':
          description: Página da fila com os totais por status
          content:
            application/json:
              schema:
                type: object
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                properties:
                  data:
                    $ref: '#/components/schemas/FilaChamadosResponse'
        '400':
          description: Paginação fora dos limites ou valor inválido em um filtro
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseError'
              example:
                status_code: 400
                message: "Erro de validação"
                data: null
                errors: ["O parâmetro 'size' deve estar entre 1 e 100."]
        '401':
          description: Sem token ou token inválido
    post:
      summary: Registrar um Chamado (HU01)
      tags:
        - Chamados
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [unidade_id, canal_origem, solicitante, descricao, categoria_id]
              properties:
                unidade_id:
                  type: string
                  format: uuid
                canal_origem:
                  type: string
                  enum: [LIGACAO, PRESENCIAL, WHATSAPP, EMAIL]
                solicitante:
                  type: object
                  required: [contato]
                  properties:
                    nome:
                      type: string
                      maxLength: 120
                    contato:
                      type: string
                      maxLength: 254
                      description: "Telefone (vira E.164; +55 quando vem sem DDI) ou e-mail (gravado em minúsculas)."
                      example: "+5581999999999"
                descricao:
                  type: string
                  minLength: 10
                  maxLength: 2000
                categoria_id:
                  type: string
                  format: uuid
                  description: "Id de uma categoria ativa (GET /categorias)."
                sistema_equipamento_id:
                  type: string
                  format: uuid
                  description: "Opcional. Id de um sistema/equipamento ativo (GET /sistemas-equipamentos)."
                registro_iniciado_em:
                  type: string
                  format: date-time
                  description: "Opcional. Quando a tela de registro foi aberta, em UTC (métrica M11). Valor no futuro ou de mais de 2 h antes da abertura é descartado, sem recusar o chamado."
                  example: "2026-10-07T14:29:15Z"
                atribuir_a_mim:
                  type: boolean
                  default: false
                  description: "Opcional (HU12). Com true, quem registra vira o responsável e o chamado vai para EM_ATENDIMENTO, com os eventos TRIAGEM_INICIADA, CHAMADO_ATRIBUIDO e CHAMADO_TRIADO. Quem não é analista ativo recebe 422."
      responses:
        '201':
          description: Chamado criado com sucesso
          content:
            application/json:
              schema:
                type: object
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                properties:
                  data:
                    $ref: '#/components/schemas/ChamadoResponse'
        '400':
          description: "Erro de validação: campo obrigatório ausente, valor fora da lista, contato inválido ou unidade, categoria ou sistema/equipamento inativo"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseError'
        '404':
          description: Unidade, categoria ou sistema/equipamento não encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseError'
              example:
                status_code: 404
                message: "Unidade não encontrada."
                data: null
                errors: null
  /chamados/totais-por-responsavel:
    get:
      summary: Contar chamados em andamento por responsável (HU10)
      description: >-
        Em andamento é tudo o que não está resolvido nem encerrado (RESOLVIDO, FECHADO, CANCELADO e MESCLADO
        ficam de fora). Responsáveis sem chamados não aparecem.
      tags:
        - Chamados
      responses:
        '200':
          description: Totais por responsável
          content:
            application/json:
              schema:
                type: object
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/TotalPorResponsavelResponse'
  /chamados/{id}:
    get:
      summary: Consultar o Chamado, Status, Responsável e Histórico (HU02 & HU05)
      tags:
        - Chamados
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Detalhes do chamado, registros de contato e linha do tempo cronológica
          content:
            application/json:
              schema:
                type: object
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                properties:
                  data:
                    $ref: '#/components/schemas/ChamadoDetalheResponse'
        '404':
          description: Chamado não encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseError'
              example:
                status_code: 404
                message: "Chamado não encontrado."
                data: null
                errors: null
  /chamados/{id}/responsavel:
    patch:
      summary: Assumir ou Reatribuir o Chamado (HU12)
      description: "Só analista de suporte ativo pode ser responsável. Grava CHAMADO_ATRIBUIDO; a primeira ação preenche primeira_resposta_em."
      tags:
        - Chamados
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResponsavelRequest'
      responses:
        '200':
          description: Responsável atribuído; devolve o detalhe atualizado
          content:
            application/json:
              schema:
                type: object
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                properties:
                  data:
                    $ref: '#/components/schemas/ChamadoDetalheResponse'
        '400':
          description: Corpo sem responsavel_id ou com valor que não é UUID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseError'
        '404':
          description: Chamado ou usuário não encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseError'
        '422':
          description: Usuário de outro perfil ou inativo, mesmo responsável ou chamado encerrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseError'
              example:
                status_code: 422
                message: "Operação não permitida"
                data: null
                errors:
                  - "O chamado já está com este responsável."
  /chamados/{id}/status:
    patch:
      summary: Alterar o Status do Chamado (HU12 e HU06)
      description: "Aceita ABERTO → EM_TRIAGEM, EM_TRIAGEM → EM_ATENDIMENTO (exige responsável), EM_ATENDIMENTO ⇄ AGUARDANDO (AGUARDANDO exige motivo_espera), ABERTO/EM_TRIAGEM → CANCELADO (exige motivo_cancelamento), RESOLVIDO → REABERTO (exige motivo_reabertura, até 7 dias depois da resolução) e REABERTO → EM_ATENDIMENTO (evento ATENDIMENTO_RETOMADO, exige responsável). RESOLVIDO, FECHADO e MESCLADO têm operação própria."
      tags:
        - Chamados
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StatusRequest'
      responses:
        '200':
          description: Status atualizado; devolve o detalhe atualizado
          content:
            application/json:
              schema:
                type: object
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                properties:
                  data:
                    $ref: '#/components/schemas/ChamadoDetalheResponse'
        '400':
          description: Sem status, valor inexistente ou motivo com mais de 500 caracteres
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseError'
        '404':
          description: Chamado não encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseError'
        '422':
          description: Transição fora do ciclo de vida, mesmo status, falta de motivo, prazo de reabertura vencido, atendimento sem responsável ou chamado encerrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseError'
              example:
                status_code: 422
                message: "Operação não permitida"
                data: null
                errors:
                  - "Não é possível ir de ABERTO para EM_ATENDIMENTO."
  /chamados/{id}/resolucao:
    patch:
      summary: Registrar a Resolução do Chamado (HU06)
      description: "Só a partir de EM_ATENDIMENTO ou AGUARDANDO. Grava resolvido_em e o evento CHAMADO_RESOLVIDO com status_anterior, resolucao, causa_raiz (quando houver) e possivel_recorrencia. Para reabrir, use PATCH /chamados/{id}/status."
      tags:
        - Chamados
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResolucaoRequest'
      responses:
        '200':
          description: Chamado resolvido; devolve o detalhe atualizado
          content:
            application/json:
              schema:
                type: object
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                properties:
                  data:
                    $ref: '#/components/schemas/ChamadoDetalheResponse'
        '400':
          description: Resolução ausente ou fora de 10 a 2000 caracteres, ou causa_raiz com mais de 1000
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseError'
              example:
                status_code: 400
                message: "Erro de validação"
                data: null
                errors:
                  - "Campo 'resolucao' deve ter entre 10 e 2000 caracteres."
        '404':
          description: Chamado não encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseError'
        '422':
          description: Status que não pode ir para RESOLVIDO, chamado já resolvido ou encerrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseError'
              example:
                status_code: 422
                message: "Operação não permitida"
                data: null
                errors:
                  - "Não é possível ir de ABERTO para RESOLVIDO."
  /chamados/{id}/contatos:
    post:
      summary: Registrar Novo Contato em Chamado Existente (HU13)
      description: "Grava o contato e o evento REGISTRO_DE_CONTATO_RECEBIDO (também para ENVIADO), com registro_contato_id, canal e direcao nos detalhes. Não muda o status. Um contato ENVIADO preenche primeira_resposta_em se ainda estiver vazio."
      tags:
        - Chamados
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegistroContatoRequest'
      responses:
        '201':
          description: Contato registrado; devolve o detalhe atualizado
          content:
            application/json:
              schema:
                type: object
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                properties:
                  data:
                    $ref: '#/components/schemas/ChamadoDetalheResponse'
        '400':
          description: Campo obrigatório ausente, valor fora da lista, contato inválido, ocorrido_em no futuro ou antes da abertura, ou identificador externo repetido no canal
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseError'
              example:
                status_code: 400
                message: "Erro de validação"
                data: null
                errors:
                  - "Este contato já foi registrado (identificador externo repetido no canal WHATSAPP)."
        '404':
          description: Chamado não encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseError'
        '422':
          description: Chamado fechado, cancelado ou mesclado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseError'
              example:
                status_code: 422
                message: "Operação não permitida"
                data: null
                errors:
                  - "Não é possível registrar contato em um chamado CANCELADO."
  /chamados/{id}/atualizacoes:
    post:
      summary: Adicionar Atualização ao Histórico (HU02)
      tags:
        - Chamados
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                descricao:
                  type: string
                visibilidade:
                  type: string
                  enum: [INTERNA, PUBLICA]
      responses:
        '201':
          description: Atualização adicionada com sucesso
          content:
            application/json:
              schema:
                type: object
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                properties:
                  data:
                    type: object
                    properties:
                      id_evento:
                        type: string
                        format: uuid
                      tipo:
                        type: string
                      data:
                        type: string
                        format: date-time
  /chamados/{id}/vinculos:
    post:
      summary: Vincular Relato Duplicado (HU03)
      tags:
        - Chamados
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                registro_contato_id:
                  type: string
                  format: uuid
                motivo:
                  type: string
      responses:
        '200':
          description: Relato vinculado
          content:
            application/json:
              schema:
                type: object
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                properties:
                  data:
                    type: object
                    properties:
                      id_evento:
                        type: string
                        format: uuid
  /chamados/{id}/prioridade:
    patch:
      summary: Definir a Prioridade do Chamado (HU04)
      tags:
        - Chamados
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                severidade:
                  type: integer
                  minimum: 1
                  maximum: 3
                urgencia:
                  type: integer
                  minimum: 1
                  maximum: 3
                impacto_operacional:
                  type: integer
                  minimum: 1
                  maximum: 3
      responses:
        '200':
          description: Prioridade calculada e definida
          content:
            application/json:
              schema:
                type: object
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                properties:
                  data:
                    type: object
                    properties:
                      status:
                        type: string
                      prioridade_calculada:
                        type: string
                      id_evento:
                        type: string
                        format: uuid
  /analistas:
    get:
      summary: Listar analistas de suporte (HU10)
      description: Qualquer usuário autenticado (alimenta a atribuição de chamados). Ordem alfabética de nome.
      tags:
        - Analistas
      parameters:
        - in: query
          name: ativo
          required: false
          description: Filtra só os ativos (true) ou só os inativos (false); sem ele, vêm todos.
          schema:
            type: boolean
      responses:
        '200':
          description: Lista de analistas
          content:
            application/json:
              schema:
                type: object
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/AnalistaResponse'
    post:
      summary: Cadastrar analista com senha temporária (HU10)
      description: >-
        Só a Liderança de TI. O perfil é sempre ANALISTA_SUPORTE e a senha é gerada pelo servidor; ela vem só
        nesta resposta (o banco guarda apenas o hash BCrypt). O e-mail precisa ser de um domínio corporativo
        (propriedade nexo.usuarios.dominios-email).
      tags:
        - Analistas
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnalistaRequest'
      responses:
        '201':
          description: Analista cadastrado
          content:
            application/json:
              schema:
                type: object
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                properties:
                  data:
                    $ref: '#/components/schemas/AnalistaCadastradoResponse'
        '400':
          description: Erro de validação ou e-mail fora do domínio corporativo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseError'
        '403':
          description: Perfil diferente de Liderança de TI
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseError'
        '409':
          description: E-mail já usado por outro usuário
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseError'
  /analistas/{id}:
    put:
      summary: Editar nome e e-mail do analista (HU10)
      description: Só a Liderança de TI. Mudar o e-mail muda o login do analista.
      tags:
        - Analistas
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnalistaRequest'
      responses:
        '200':
          description: Analista atualizado
          content:
            application/json:
              schema:
                type: object
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                properties:
                  data:
                    $ref: '#/components/schemas/AnalistaResponse'
        '400':
          description: Erro de validação ou e-mail fora do domínio corporativo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseError'
        '403':
          description: Perfil diferente de Liderança de TI
        '404':
          description: Analista não encontrado
        '409':
          description: E-mail já usado por outro usuário
  /analistas/{id}/desativar:
    patch:
      summary: Desativar analista logicamente (HU10)
      description: >-
        Só a Liderança de TI. O analista perde o acesso na próxima requisição (o filtro JWT confere a situação
        no banco) e não recebe novos chamados; continua como autor no histórico.
      tags:
        - Analistas
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Analista desativado
          content:
            application/json:
              schema:
                type: object
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                properties:
                  data:
                    $ref: '#/components/schemas/AnalistaResponse'
        '403':
          description: Perfil diferente de Liderança de TI
        '404':
          description: Analista não encontrado
  /analistas/{id}/reativar:
    patch:
      summary: Reativar analista (HU10)
      description: Só a Liderança de TI. Devolve o acesso e a possibilidade de receber chamados.
      tags:
        - Analistas
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Analista reativado
          content:
            application/json:
              schema:
                type: object
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                properties:
                  data:
                    $ref: '#/components/schemas/AnalistaResponse'
        '403':
          description: Perfil diferente de Liderança de TI
        '404':
          description: Analista não encontrado
