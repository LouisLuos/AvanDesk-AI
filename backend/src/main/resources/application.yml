spring:
  application:
    name: avandesk-api

  datasource:
    url: jdbc:postgresql://localhost:5432/avandesk_db
    username: avandesk
    password: avandesk_dev
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    schemas: public

  security:
    user:
      name: admin
      password: admin

server:
  port: 8080

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui
