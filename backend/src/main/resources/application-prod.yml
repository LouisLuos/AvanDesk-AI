server:
  port: ${PORT:8080}

spring:
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    hikari:
      maximum-pool-size: 5
      minimum-idle: 2
      connection-timeout: 20000
      idle-timeout: 300000

  jpa:
    show-sql: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    # Sem db/seed: dados essenciais carregados via migrations versionadas
    locations: classpath:db/migration

  mail:
    host: ${SMTP_HOST}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: ${SMTP_AUTH:true}
      mail.smtp.starttls.enable: ${SMTP_STARTTLS:true}
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000

nexo:
  origem-dado: REAL
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: ${JWT_EXPIRATION_MS:3600000}
    cookie-secure: true
    cookie-same-site: Lax
    cookie-path: /api
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:https://nexodesk-ai-sandy.vercel.app,https://avandesk-ai.vercel.app}
  usuarios:
    # Lista separada por vírgula, ex.: lumen.local,lumendiagnosticos.com.br
    dominios-email: ${NEXO_DOMINIOS_EMAIL:lumen.local}
  notificacoes:
    email:
      habilitado: ${NEXO_NOTIFICACOES_EMAIL_HABILITADO:true}
      remetente: ${NEXO_EMAIL_REMETENTE}
      intervalo-reenvio: ${NEXO_EMAIL_INTERVALO_REENVIO:PT1M}
